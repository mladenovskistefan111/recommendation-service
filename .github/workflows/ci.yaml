name: CI

# Pull-request gate: guards (change detection, secrets, workflows) start at t=0; when code changed, lint, build, tests, SCA, SAST
# and an image build + CVE scan run in parallel with them; nothing is pushed. The only required status check is `ci / gate`.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      packages: read # reads the registry build cache
    uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci-python.yaml@ee7562da9860ad2c824ce50e6d56c1f62f1d3515 # v3.3.0
    with:
      trivyignores: .trivyignore
