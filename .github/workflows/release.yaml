name: Release

# Runs when a semver tag is pushed (git tag -a v1.2.3 && git push origin v1.2.3) or by hand.
# Gates: same as CI. Then the scanned image digest is promoted to Docker Hub and signed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the scanned image to Docker Hub and sign it (commit must be on main)
        type: boolean
        default: false

permissions: {}

jobs:
  python:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/python-ci.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0

  image:
    needs: [python]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0
    with:
      trivyignores: .trivyignore

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0

  promote:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: [image, workflows]
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-promote.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0
    with:
      image-name: recommendation-service
      staged-image: ${{ needs.image.outputs.staged-image }}
      digest: ${{ needs.image.outputs.digest }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
